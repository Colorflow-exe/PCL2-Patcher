name: Release

# published: 发布 Release 后自动把构建产物挂上去
# dispatch: 手动为指定 tag 的 Release 追加产物
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      target_release_tag:
        description: The tag of the release you want to append the artifact to
        required: true
        type: string

jobs:
  # 确认目标 Release 存在，避免挂到不存在的 tag 上
  validate_release:
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub release information
        uses: cardinalby/git-get-release-action@1.2.6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.target_release_tag }}

  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    needs:
      - validate_release
    with:
      release: true

  release:
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: PCL2Patch-win-x64

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.target_release_tag }}
          files: |
            PCL2Patch.exe
            SHA256SUMS.txt
