name: _step.build

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # .NET Framework 4.8（Windows 自带）+ Costura.Fody 合并为单 exe（无 dll、不落盘解压）
      - name: Build GUI (.NET Framework 4.8, single exe)
        run: dotnet build src/PCL2Patcher.Gui/PCL2Patcher.Gui.csproj -c Release

      - name: Package
        shell: pwsh
        run: |
          Copy-Item src/PCL2Patcher.Gui/bin/Release/net48/PCL2Patcher.exe PCL2Patcher.exe
          "$((Get-FileHash PCL2Patcher.exe -Algorithm SHA512).Hash.ToLower())  PCL2Patcher.exe" | Set-Content -Encoding ascii SHA-512
          Get-Content SHA-512
          Get-ChildItem PCL2Patcher.exe | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PCL2Patcher-win-x64
          path: |
            PCL2Patcher.exe
            SHA-512
