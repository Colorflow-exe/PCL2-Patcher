name: _step.build

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish CLI (framework-dependent, single file)
        run: dotnet publish src/PCL2Patch.Cli/PCL2Patch.Cli.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out/cli

      - name: Publish GUI (self-contained, single file)
        run: dotnet publish src/PCL2Patch.Gui/PCL2Patch.Gui.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out/gui

      - name: Package
        shell: pwsh
        run: |
          Copy-Item out/cli/PCL2Patch.Cli.exe PCL2Patch.Cli.exe
          Copy-Item out/gui/PCL2Patch.exe PCL2Patch.exe
          $lines = @(
            "$((Get-FileHash PCL2Patch.exe -Algorithm SHA256).Hash.ToLower())  PCL2Patch.exe",
            "$((Get-FileHash PCL2Patch.Cli.exe -Algorithm SHA256).Hash.ToLower())  PCL2Patch.Cli.exe"
          )
          $lines | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Get-ChildItem PCL2Patch*.exe | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PCL2Patch-win-x64
          path: |
            PCL2Patch.exe
            PCL2Patch.Cli.exe
            SHA256SUMS.txt
