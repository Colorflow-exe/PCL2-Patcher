name: _step.build

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # WPF + WPF-UI 在 PublishSingleFile 下启动会崩溃，因此发布为 self-contained 目录并打 zip
      - name: Publish GUI (self-contained, folder)
        run: dotnet publish src/PCL2Patch.Gui/PCL2Patch.Gui.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o out/PCL2Patch

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path out/PCL2Patch/* -DestinationPath PCL2Patch-win-x64.zip
          "$((Get-FileHash PCL2Patch-win-x64.zip -Algorithm SHA256).Hash.ToLower())  PCL2Patch-win-x64.zip" | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Get-ChildItem PCL2Patch-win-x64.zip | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PCL2Patch-win-x64
          path: |
            PCL2Patch-win-x64.zip
            SHA256SUMS.txt
